# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

parameters:
    # Root of the file storage, kept identical to the original application so
    # the same directory can be shared or restored from a backup.
    campfire.storage_dir: '%kernel.project_dir%/storage'
    campfire.files_dir: '%kernel.project_dir%/storage/files'
    # Images shipped with the application, served by the controllers that fall
    # back to them.
    campfire.images_dir: '%kernel.project_dir%/assets/images'
    campfire.page_size: 40

    # Reported on every response by the version headers listener.
    campfire.app_version: '%env(APP_VERSION)%'
    campfire.git_revision: '%env(GIT_REVISION)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # The Mercure hub decorator keeps publishing working from the CLI and the
    # test suite, where the FrankenPHP native function is unavailable.
    # A negative priority makes it the outermost decorator, ahead of the
    # profiler's TraceableHub, so the test short-circuit is never bypassed.
    # The arguments are wired on the class; the inner hub is autowired because
    # it is the only argument of the decorated HubInterface type.
    App\Mercure\HubDecorator:
        decorates: mercure.hub.default
        decoration_priority: -10

    # Reading a page someone linked to must not become a way to reach the
    # machine the application runs on or the network behind it, so the client
    # used for link previews refuses private addresses. It is public so a test
    # can put its own client in front of the guard.
    app.opengraph.http_client:
        class: Symfony\Component\HttpClient\NoPrivateNetworkHttpClient
        arguments: ['@http_client']
        public: true

    # Several services speak HttpClientInterface, so the guarded client used for
    # link previews is picked by name rather than by type.
    Symfony\Contracts\HttpClient\HttpClientInterface $opengraph:
        alias: app.opengraph.http_client

    # The client a bot webhook is called with. It is public so a test can put
    # its own client in its place. See the class for why it is a service of its
    # own rather than the client the rest of the application calls.
    App\Bot\WebhookClient:
        public: true

    # Push endpoints belong to browser vendors, but they are still addresses
    # written into the database, so the client that reaches them refuses private
    # addresses. It is public so a test can put its own client in front of the
    # guard.
    app.push.http_client:
        class: Symfony\Component\HttpClient\NoPrivateNetworkHttpClient
        arguments: ['@http_client']
        public: true

    # The Web Push library speaks PSR-18 and PSR-17. The factories are wired
    # here rather than discovered, so the library is handed the same guarded
    # client as the request factory and never reaches the network unguarded.
    app.push.psr17_factory:
        class: Nyholm\Psr7\Factory\Psr17Factory

    app.push.psr18_client:
        class: Symfony\Component\HttpClient\Psr18Client
        arguments:
            - '@app.push.http_client'
            - '@app.push.psr17_factory'
            - '@app.push.psr17_factory'
            - '@app.push.psr17_factory'

when@test:
    parameters:
        # Tests write the files they upload under var/, so a test run never
        # touches the storage of the application.
        campfire.files_dir: '%kernel.project_dir%/var/test/files'
