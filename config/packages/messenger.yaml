framework:
    messenger:
        failure_transport: failed

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    # The original application runs its jobs through Resque,
                    # which makes a single attempt: a delivery that fails is not
                    # tried again, it is left as it is.
                    max_retries: 0
            failed: 'doctrine://default?queue_name=failed'

        default_bus: messenger.bus.default

when@test:
    framework:
        messenger:
            transports:
                # Tests run everything inline and never touch the doctrine queue.
                async: 'sync://'
